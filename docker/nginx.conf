server {
    listen       80;
    server_name  _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: try requested file, then fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets (let nginx serve directly)
    location /assets/ {
        try_files $uri =404;
    }

    # Basic gzip for small savings
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
